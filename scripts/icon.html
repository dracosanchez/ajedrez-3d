<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}
.i{width:100vw;height:100vh;display:grid;place-items:center;font-family:'Segoe UI Symbol',serif}
.any{background:transparent}
.any .tile{width:92vw;height:92vw;border-radius:20vw;background:linear-gradient(145deg,#f3d28c,#c9963d);display:grid;place-items:center;box-shadow:inset 0 -2vw 4vw rgba(0,0,0,.18),inset 0 2vw 3vw rgba(255,255,255,.35)}
.mask{background:radial-gradient(circle at 50% 40%,#2b2f37,#111317 75%)}
.k{font-size:64vw;line-height:1;margin-top:-6vw;color:#1b1610;text-shadow:0 1.2vw 0 rgba(255,255,255,.25)}
.mask .k{font-size:50vw;color:#e6bd6a;text-shadow:0 1vw 3vw rgba(0,0,0,.6);margin-top:-4vw}
</style></head><body>
<div class="i" id="r"></div>
<script>
const m=location.hash==='#mask';
document.getElementById('r').className='i '+(m?'mask':'any');
document.getElementById('r').innerHTML=m?'<div class="k">♞&#xFE0E;</div>':'<div class="tile"><div class="k">♞&#xFE0E;</div></div>';
</script></body></html>
